spring:
  datasource:
    # Local restored database only; do not inherit beta credentials/DB_URL.
    url: jdbc:sqlserver://127.0.0.1:1433;databaseName=dpsbsr_edufox_net;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=false;trustServerCertificate=true;loginTimeout=5
    username: ''
    password: ''
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      read-only: ${DB_READ_ONLY:false}
      connection-timeout: 10000
app:
  auth:
    database-read-only: ${AUTH_DATABASE_READ_ONLY:false}
    otp-enabled: ${AUTH_OTP_ENABLED:false}
  master-settings:
    write-enabled: ${MASTER_SETTINGS_WRITE_ENABLED:true}
