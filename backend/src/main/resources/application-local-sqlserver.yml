spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=dpsbsr_edufox_net;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=false;trustServerCertificate=true;loginTimeout=5}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    hikari:
      read-only: ${DB_READ_ONLY:false}
      connection-timeout: 10000
app:
  auth:
    database-read-only: ${AUTH_DATABASE_READ_ONLY:false}
    allow-database-writes: ${AUTH_ALLOW_DATABASE_WRITES:true}
    otp-enabled: ${AUTH_OTP_ENABLED:false}
  master-settings:
    write-enabled: ${MASTER_SETTINGS_WRITE_ENABLED:true}
