server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: school-erp-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/beta_dpsbsr_edufox_net?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      read-only: true
      connection-timeout: 10000
  jackson:
    default-property-inclusion: non_null
app:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    database-read-only: ${AUTH_DATABASE_READ_ONLY:true}
    otp-enabled: ${AUTH_OTP_ENABLED:true}
  master-settings:
    write-enabled: ${MASTER_SETTINGS_WRITE_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
